# Development overrides — NOT auto-loaded.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./apps/backend/src:/app/src:ro
      - ./apps/backend/prisma:/app/prisma
      - uploads_data:/app/uploads
    environment:
      NODE_ENV: development
    command: npm run start:dev
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./apps/frontend/src:/app/src:ro
      - ./apps/frontend/public:/app/public:ro
      - ./apps/frontend/index.html:/app/index.html:ro
      - ./apps/frontend/tailwind.config.js:/app/tailwind.config.js:ro
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-3000}/api
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    # Dev: only expose Vite port (no 8080/nginx)
    expose: []
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
