services:
  # ===========================================
  # PostgreSQL Database
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: leasing-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leasing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leasing123}
      POSTGRES_DB: ${POSTGRES_DB:-leasing_platform}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - leasing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leasing} -d ${POSTGRES_DB:-leasing_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================
  # Redis Cache (Optional - for sessions/caching)
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: leasing-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - leasing-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Backend API (NestJS)
  # ===========================================
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: leasing-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-leasing}:${POSTGRES_PASSWORD:-leasing123}@postgres:5432/${POSTGRES_DB:-leasing_platform}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-thiso-leasing-jwt-secret-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ALLOW_PUBLIC_REGISTER: ${ALLOW_PUBLIC_REGISTER:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-THISO Leasing <noreply@thiso.com.vn>}
      NODE_ENV: production
      PORT: 3000
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    networks:
      - leasing-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ===========================================
  # Database Migration & Seed (Run Once)
  # ===========================================
  migrate:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    container_name: leasing-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-leasing}:${POSTGRES_PASSWORD:-leasing123}@postgres:5432/${POSTGRES_DB:-leasing_platform}
      SEED_DATABASE: ${SEED_DATABASE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - leasing-network
    command: sh -c "npx prisma migrate deploy && if [ \"$$SEED_DATABASE\" = \"true\" ]; then npx ts-node --transpile-only prisma/seed.ts; fi"
    profiles:
      - migrate

  # ===========================================
  # Frontend (React + Nginx)
  # ===========================================
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: leasing-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - leasing-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

# ===========================================
# Networks
# ===========================================
networks:
  leasing-network:
    driver: bridge
    name: leasing-network

# ===========================================
# Volumes
# ===========================================
volumes:
  postgres_data:
    name: leasing-postgres-data
  redis_data:
    name: leasing-redis-data
  uploads_data:
    name: leasing-uploads
  logs_data:
    name: leasing-logs
