# THISO Leasing Platform — Nginx Reverse Proxy
# Domain: uatls.thisoretail.store
# Copy to: /etc/nginx/sites-available/leasing
# Then: ln -s /etc/nginx/sites-available/leasing /etc/nginx/sites-enabled/leasing

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name uatls.thisoretail.store;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS main
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uatls.thisoretail.store;

    ssl_certificate     /etc/letsencrypt/live/uatls.thisoretail.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uatls.thisoretail.store/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Upload size limit (for contract file uploads — max 30MB)
    client_max_body_size 35M;

    # ── Backend API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Uploaded files (contracts, unit media, floor plans) ─────────────────
    location /uploads/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires            7d;
        add_header         Cache-Control "public, immutable";
    }

    # ── Frontend (React SPA) ─────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
